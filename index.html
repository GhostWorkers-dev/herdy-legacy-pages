<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Herdy Support</title>
  <meta name="description" content="Support for Herdy, the direct SSH and Mosh terminal for your phone.">
  <style>
    :root { color-scheme: dark; font-family: "JetBrains Mono", ui-monospace, monospace; background: #080b0a; color: #e8eee9; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(42rem, calc(100% - 2.5rem)); padding: 4rem 0; }
    .mark { width: 5rem; height: 5rem; border-radius: 1.25rem; box-shadow: 0 0 2rem #35e87a66; }
    h1 { margin: 1.5rem 0 .5rem; font-size: clamp(2.25rem, 8vw, 4rem); letter-spacing: -.08em; }
    p { line-height: 1.65; color: #b8c2ba; }
    a { color: #35e87a; text-underline-offset: .25rem; }
    nav { display: flex; gap: 1.5rem; margin-top: 2rem; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main>
    <img class="mark" src="herdy-icon.png" alt="Herdy’s glowing green sheep icon">
    <h1>Herdy</h1>
    <p>Your phone-first SSH and Mosh terminal. Herdy connects directly to your machines and keeps long-running Herdr, tmux, and Zellij sessions within reach.</p>
    <p>Need help? Email <a href="mailto:ren@kasanova.io">ren@kasanova.io</a>.</p>
    <nav>
      <a href="privacy.html">Privacy policy</a>
      <a href="mailto:ren@kasanova.io?subject=Herdy%20support">Contact support</a>
    </nav>
  </main>
</body>
</html>
